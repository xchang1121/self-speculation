[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-speculation"
version = "0.1.0"
description = "Engine-agnostic streaming self-speculation for tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["llm", "speculative-decoding", "tool-calling", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
server = ["fastapi>=0.115"]
transformers = ["torch>=2.2", "transformers>=5.0,<6"]
test = ["fastapi>=0.115", "httpx>=0.27"]

[project.entry-points."vllm.endpoint_plugins"]
self_speculation = "self_speculation.integrations.vllm:SelfSpeculationEndpointPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
self_speculation = ["py.typed"]
